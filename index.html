<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather_Now</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>



    <div class="card">
      <div class="search">
        <input id="city-input" name="city"  type="text" placeholder="enter city name" spellcheck="false" />
        <button id="searchButton"><img src="images/search.png" /></button>

      </div>



        <div class="header__unit">
            <span class="unit-label left">CELSIUS</span>

            <input
            type="checkbox"
            id="unitSwitch"
            class="unit-switch__input"
              aria-label="Byt mellan Celsius och Fahrenheit"
            />

            <label for="unitSwitch" class="unit-switch__track"></label>


            <span class="unit-label right">FAHRENHEIT</span>
            

        </div>


        <div class="weather-info">
    <img src="images/rain.png" class="weather-icon" alt="Weather Icon">
    
   <!--<h1 id="temp">--°C</h1>
    <h2 id="city">Sök efter en stad</h2>-->
</div>

     <!-- <div class="weather">
        <img src="./images/rain.png" id="weather-icon" />
         <div id="weather-icon">☁️</div> -->


        <!--<h1 id="temp"></h1>
        <h2 id="city"></h2>-->
<!--<div class="weather-info">
  <img src="images/rain.png" class="weather-icon" alt="Weather Icon">-->
  <h1 id="temp">--°C</h1>
  <h2 id="city">Sök efter en stad</h2>

        <p id="country"></p>
        <p id="description"></p>
        <p id="updated"></p>
        <div class="details">
          <div class="colmn">
            <img src="images/humidity.png" />
            <div>
              <p class="humidity"></p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="colmn">
            <img src="images/wind.png" />
            <div>
              <p class="wind"></p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script defer src="./js/main.js" type="module"></script>
  </body>
</html>
